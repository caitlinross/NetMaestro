<div class="card bg-base-100 min-w-max mb-4" x-data="heatmapPlot">
  <div class="card-body">
    <h2 class="card-title text-white" x-text="plotTitle">
      Heatmap
    </h2>
    <div x-show="noData" x-cloak class="flex items-center justify-center h-64 text-base-content/50">
      <span x-text="`No data available for this run's ${plotTitle.toLowerCase()}.`"></span>
    </div>
    <div id="heatmapPlot" x-show="!noData"></div>
  </div>
  <div class="flex" x-show="!noData && isPlotInitialized">
    <div class="flex-1 selects">
      <fieldset>
        <legend class="fieldset-legend">
          Choose metric
        </legend>
        <select
          class="select"
          x-model="selectedMetric"
          @change="updatePlotData"
        >
          <template x-for="metric in metricList" :key="metric.key">
            <option
              :value="metric.key"
              x-text="metric.label"
              :disabled="!!metric.disabled"
              :title="metric.tooltip || ''"
            ></option>
          </template>
        </select>
      </fieldset>
    </div>
  </div>
</div>
