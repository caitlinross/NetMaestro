<div class="bg-base-300 overflow-y-auto" style="height: calc(100vh - 64px);" x-data="topologyCanvas"
     data-create-url="{% url 'api-topology-create' %}"
     data-component-models-url="{% url 'api-component-models' %}?base_model=fluid-flow-wan-switch-lp">
  <div class="p-8 flex flex-row gap-6 h-full">
    <div class="flex flex-col items-start gap-4">
      <div>
        <h1 class="text-3xl font-semibold">Topology</h1>
        {% if family %}
        <p class="text-[12.5px] leading-relaxed mt-1" style="color:var(--text-dim);">
          Showing {{ family_label }} topologies only.
          <a
            href="{% url 'topology-partial' %}"
            hx-get="{% url 'topology-partial' %}"
            hx-target="#main-content"
            hx-swap="innerHTML"
            hx-push-url="true"
            class="link link-secondary"
          >
            Show all topologies
          </a>
        </p>
        {% else %}
        <p class="text-[12.5px] leading-relaxed mt-1" style="color:var(--text-dim);">
          Preview a network topology.
        </p>
        {% endif %}
      </div>
      <fieldset>
        <legend class="fieldset-legend">Topology</legend>
        <select class="select w-80" x-ref="picker" @change="select($event.target)">
          <option value="">
            {% if family and not topologies %}No {{ family_label }} topologies yet{% else %}Select a topology...{% endif %}
          </option>
          {% for topology in topologies %}
          <option
            value="{{ topology.name }}"
            data-url="{% url 'api-topology-detail' name=topology.name %}"
          >
            {{ topology.label }} &mdash; {{ topology.summary }}
          </option>
          {% endfor %}
        </select>
      </fieldset>
      <div class="flex w-80 justify-between">
        <button type="button" class="btn" @click="openEditor(true)">
          <i class="ri-add-line" aria-hidden="true"></i>
          Create New
        </button>
        <button type="button" class="btn" @click="openEditor(false)" x-show="topology">
          <i class="ri-edit-line" aria-hidden="true"></i>
          Edit
        </button>
      </div>
    </div>

    <div class="card bg-base-100 shadow-sm flex-1 min-h-0">
      <!-- Empty state -->
      <div class="card-body items-center justify-center text-center"
           x-show="!topology && !loading && !error">
        <i class="ri-organization-chart text-4xl text-base-content/50" aria-hidden="true"></i>
        <h2 class="card-title mt-4">No topology selected</h2>
        <p class="text-[12.5px]" style="color:var(--text-dim);">
          Choose or create a topology to preview it.
        </p>
      </div>
      <!-- Loading state -->
      <div class="card-body items-center justify-center text-center" x-show="loading" x-cloak>
        <span class="loading loading-spinner loading-lg"></span>
      </div>
      <!-- Error state -->
      <div class="card-body items-center justify-center text-center" x-show="error" x-cloak>
        <i class="ri-error-warning-line text-4xl text-error" aria-hidden="true"></i>
        <h2 class="card-title mt-4" x-text="error"></h2>
      </div>
      <!-- Loaded topology -->
      <div class="card-body flex flex-col min-h-0" x-show="topology && !loading" x-cloak>
        <div class="flex flex-row items-start justify-between gap-4">
          <div>
            <h2 class="card-title" x-text="topology?.label"></h2>
            <p class="text-[12.5px]" style="color:var(--text-dim);" x-text="topology?.summary"></p>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" @click="fitToView()">
            <i class="ri-fullscreen-line" aria-hidden="true"></i>
            Fit
          </button>
        </div>
        <div x-ref="canvas" class="flex-1 min-h-96 rounded-box bg-base-200"></div>
      </div>
    </div>
  </div>

  {% include 'net_maestro/partials/topology_editor.html' %}
</div>
